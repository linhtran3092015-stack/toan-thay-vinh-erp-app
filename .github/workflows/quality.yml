name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM0MTk4NDB9.mock-key-for-ci-build-only-1234567890

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Payroll projection regression (isolated PostgreSQL)
        run: node scripts/test-payroll-projection-db.mjs
      - name: Tuition readiness regression (isolated PostgreSQL)
        run: node scripts/test-tuition-readiness-db.mjs
      - run: npm run build
      - run: npm run test:db:fresh
